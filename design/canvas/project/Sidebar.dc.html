  <div style="display: flex; flex-direction: column; gap: 2px">

    <a href="HQ.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{ bg.hq }}; color: {{ fg.hq }}">

      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z M8 9h5M8 12h5M8 15h3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>Contracts</a>

    <a href="Research.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{ bg.research }}; color: {{ fg.research }}">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3h4M9 3v5l-4.5 7.5A1 1 0 005.4 17h9.2a1 1 0 00.9-1.5L11 8V3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>Research</a>

      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8l7-4 7 4M4 8v7M8 8v7M12 8v7M16 8v7M3 16h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>Bank</a>

    <a href="Showroom.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 14px; font-weight: 500; background: {{ bg.showroom }}; color: {{ fg.showroom }}">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7l3-3h8l3 3-7 9z M3 7h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>Showroom</a>

    <div style="height: 6px; background: #252C38; border-radius: 999px; overflow: hidden"><div style="width: 41%; height: 100%; background: #F2B33D"></div></div>
    <span style="font-size: 12px; color: #9AA4B2">Tier 17 / 40 · next: steel truck livery</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["hq","prod","market","contracts","design","research","bank","league","showroom"],"default":"hq"},"$preview":{"width":248,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'hq';
    const keys = ['hq', 'prod', 'market', 'contracts', 'design', 'research', 'bank', 'league', 'showroom'];
    const bg = {}, fg = {};
    keys.forEach(k => {
      bg[k] = k === active ? '#1E2530' : 'transparent';
      fg[k] = k === active ? '#F2B33D' : '#C4CBD5';
    });
    return { bg, fg };
  }
}
</script>
